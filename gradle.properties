# Project-wide Gradle settings.
# 适配 Termux 手机环境：降低内存占用，关闭并行构建
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=true
# 增加网络超时
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# ===== Termux ARM64 专用配置 =====
# 使用 Android SDK build-tools 中的 ARM 版 aapt2，替代 Maven 下载的 x86_64 版
# 注意：路径必须指向 aapt2 可执行文件本身，不是目录
android.aapt2FromMavenOverride=/data/data/com.termux/files/home/android-sdk/build-tools/34.0.0/aapt2
