# Project-wide Gradle settings.
# 适配 Termux 手机环境：降低内存占用，关闭并行构建
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=true
# 增加网络超时
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# ===== Termux ARM64 专用配置 =====
# 说明：先不要设置 aapt2FromMavenOverride，让 AGP 从 Maven 下载与版本匹配的 aapt2，
# 然后手动用 Termux 的 ARM 版 aapt2 替换掉缓存中的 x86_64 二进制文件。
# 具体步骤见构建指引。
